; airRohr – modular rewrite (C++/PlatformIO)
; Primary platform: ESP32 (Arduino Core 2.x). You edit small modules in src/,
; the build links them together – no more 6000-line .ino.

[platformio]
default_envs = esp32dev
src_dir = src

; The ESP32 core embeds __FILE__ in its log/assert macros, so the absolute path
; of the PlatformIO package directory ends up in the binary - two machines then
; produce images of different size. -ffile-prefix-map replaces that prefix, so a
; build depends on the sources only (and the path strings get shorter).
[common]
build_flags =
  -D NDEBUG
  -Wall
  -ffile-prefix-map=${platformio.core_dir}=/pio
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit HTU21DF Library@^1.1.2
  adafruit/Adafruit BMP085 Library@^1.2.4
  adafruit/Adafruit SHT31 Library@^2.2.2
  sparkfun/SparkFun SCD30 Arduino Library@^1.0.20
  mikalhart/TinyGPSPlus@^1.0.3
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; evaluates the #if feature guards so that disabled sensors/senders do NOT
; pull their libraries into the binary either:
lib_ldf_mode = chain+
board_build.filesystem = littlefs
; Two 1.9 MB OTA app slots + small LittleFS data area (~190 KB).
; Keeps OTA (dual slot) and doubles the app space vs. the default table.
board_build.partitions = min_spiffs.csv
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; Size demo: what the profile contains is defined in src/Features.h
; (PROFILE_MINIMAL) - deliberately not spelled out here.
[env:esp32dev_minimal]
extends = env:esp32dev
build_flags = ${common.build_flags} -D PROFILE_MINIMAL

; airRohr-ESP32 carrier board (rain + wind) - see PROFILE_CARRIER in src/Features.h.
[env:esp32_carrier]
extends = env:esp32dev
build_flags = ${common.build_flags} -D PROFILE_CARRIER

; Reduced ESP8266 build - see PROFILE_ESP8266 in src/Features.h.
[env:esp8266test]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_ldf_mode = chain+
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -D PROFILE_ESP8266
