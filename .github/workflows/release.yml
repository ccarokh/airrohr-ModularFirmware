name: Release

# Tag v1.1.0 -> builds every release target and attaches the .bin files to the
# GitHub release. Keeps "prebuilt firmware under Releases" true without anyone
# uploading binaries from their laptop.
#
# Dry run without publishing: run the workflow manually (workflow_dispatch),
# the binaries then show up as build artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PlatformIO downloads toolchains and libraries on the first run.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The file names come from AIRROHR_VERSION in src/Board.h. If that does
      # not match the tag, the release would ship mislabelled binaries.
      - name: Check tag against src/Board.h
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*AIRROHR_VERSION "AR-modular-\(.*\)".*/\1/p' src/Board.h)
          tag="${GITHUB_REF_NAME#v}"
          echo "Board.h: $version, tag: $tag"
          [ "$version" = "$tag" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match AIRROHR_VERSION $version"
            exit 1
          }

      - name: Build release binaries
        run: ./tools/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*

      # Idempotent on purpose: the tag may come from `gh release create`, in
      # which case the release already exists when this job starts.
      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists, replacing the binaries"
            gh release upload "$GITHUB_REF_NAME" dist/*.bin dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.bin dist/*.sha256
          fi
